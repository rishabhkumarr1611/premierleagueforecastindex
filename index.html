const T=[["Save %",n_(g.sp,1)+"%"],["Saves",n_(g.saves)+" from "+n_(g.sota)+" shots on target"],["Goals against",n_(g.ga)+" ("+n_(g.ga90,2)+" per 90)"],["Clean sheets",n_(g.cs)+" ("+n_(g.csp)+"%)"],["Record (W-D-L)",n_(g.w)+"-"+n_(g.d)+"-"+n_(g.l)],["Penalties saved",n_(g.pksv)+" of "+n_(g.pkatt)+" faced"]];
return`<h2>Goalkeeping this season</h2><div class="gs">${T.map(([a,b])=>`<div><small>${a}</small><b class="num">${b}</b></div>`).join("")}</div><p class="note" style="margin:0 0 12px">${g.mp} games so far, so these numbers move a lot from match to match.</p>`}

function shell(){const p=cur;$("d").innerHTML=`<div class="hd"><div class="av" aria-hidden="true">${p.name.split(" ").filter(Boolean).map((w,i,a)=>i==0||i==a.length-1?w[0]:"").join("")}</div><div><h2 style="font-size:28px;margin:0">${p.name}</h2><div class="sub">${p.club} · ${p.pos} · age ${p.age.toFixed(0)} at season start</div></div></div>

${GKP(p)?gkBlock(p):""}<div class="sub">Forecast value in August 2027</div><div class="big num" id="out"></div><div class="sub" id="rng"></div>
<h2>Value history and forecast</h2><canvas id="c" role="img" aria-label="Line chart of market value history with the forecast to August 2027"></canvas><h2>Test a scenario</h2>${GKP(p)?sl("g","Goals conceded per 90",0,3,0.05,S.ga90)+sl("a","Clean sheets (% of games)",0,100,1,Math.round(S.cs*100)):sl("g","Goals this season",0,40,0.5,S.goals)+sl("a","Assists this season",0,25,0.5,S.assists)}${sl("m","League minutes",0,3420,30,S.minutes)}${sl("t","Team points per game",0.4,2.6,0.05,S.ppg)}
<label style="display:flex;gap:8px;margin:8px 0"><input type="checkbox" id="mc"> Player changes club during the season</label><button class="reset" id="rs">Reset to projection</button>

for(const [id,k] of [["g",GKP(p)?"ga90":"goals"],["a",GKP(p)?"cs":"assists"],["m","minutes"],["t","ppg"]])$(id).oninput=e=>{S[k]=+e.target.value/(k=="cs"?100:1);upd()};

drawC(p,v,lo,hi);const grp=GKP(p)?{"Starting value":["lnv"],"Age":["age","age2"],"Minutes played":["mshare"],"Goals conceded":["ga90"],"Clean sheets":["cs"],"Team strength":["ppg"],"Club move":["moved"]}:{"Starting value":["lnv"],"Age":["age","age2"],"Position":["pos_Attack","pos_Midfield"],"Minutes played":["mshare"],"Goals":["g90"],"Assists":["a90"],"Team strength":["ppg"],"Club move":["moved"]};
const rows=Object.entries(grp).map(([k,fs])=>[k,fs.reduce((a,f)=>a+MD(p).coef[MD(p).F.indexOf(f)]*(x[f]-MEAN[GKP(p)][f]),0)]),mx=Math.max(.05,...rows.map(r=>Math.abs(r[1])));

$("rows").onclick=e=>{const b=e.target.closest(".row");if(!b)return;cur=P.find(p=>p.id==b.dataset.id);S=def(cur);shell();list();if(innerWidth<=800)$("d").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})};

const pal=()=>{const s=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();return{ink:s("--ink"),mute:s("--mute"),line:s("--line"),acc:s("--acc"),up:s("--up"),dn:s("--dn"),bg:s("--panel")}};

g.font=`${fs}px "IBM Plex Sans",system-ui,sans-serif`;g.lineWidth=1;
for(let i=0;i<=4;i++){const y=top*i/4;g.strokeStyle=k.line;g.beginPath();g.moveTo(X,sy(y));g.lineTo(X+W,sy(y));g.stroke();g.fillStyle=k.mute;g.textAlign="left";g.textBaseline="bottom";g.fillText("€"+(y>=10?Math.round(y):y.toFixed(1))+"m",X+2,sy(y)-2)}
g.textAlign="center";g.textBaseline="top";const st=Math.max(1,Math.ceil((x1-x0)/6));for(let y=x0+1;y<=2027;y+=st){g.fillStyle=k.mute;g.fillText(y,sx(y),Y+H+5)}

const l=h[h.length-1],c=v>=cur.value?k.up:k.dn;g.setLineDash([fs*.6,fs*.4]);g.strokeStyle=c;g.beginPath();g.moveTo(sx(l[0]),sy(l[1]));g.lineTo(sx(2027.58),sy(v/1e6));g.stroke();g.setLineDash([]);
g.lineWidth=fs/3;g.strokeStyle=k.mute;g.globalAlpha=.45;g.beginPath();g.moveTo(sx(2027.58),sy(lo/1e6));g.lineTo(sx(2027.58),sy(hi/1e6));g.stroke();g.globalAlpha=1;
g.fillStyle=c;g.beginPath();g.arc(sx(2027.58),sy(v/1e6),fs*.4,0,7);g.fill()}
function drawC(p,v,lo,hi){const c=$("c"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*d;c.height=h*d;const g=c.getContext("2d");g.scale(d,d);plot(g,6,20,w-16,h-42,pal(),12,v,lo,hi)}

T("Value now",60,210,'22px "IBM Plex Sans",system-ui,sans-serif',k.mute);T(eur(p.value),60,256,'600 40px "IBM Plex Sans",system-ui,sans-serif',k.ink);

T(`80% range: ${eur(v/Math.exp(1.28*MD(p).sig))} to ${eur(v*Math.exp(1.28*MD(p).sig))}`,60,492,'22px "IBM Plex Sans",system-ui,sans-serif',k.mute);
T(`Scenario: ${GKP(p)?S.ga90.toFixed(2)+" goals conceded per 90, "+Math.round(S.cs*100)+"% clean sheets":S.goals.toFixed(1)+" goals, "+S.assists.toFixed(1)+" assists"}, ${S.minutes} league minutes, team ${S.ppg.toFixed(2)} pts/game${S.moved?", club move":""}`,60,526,'22px "IBM Plex Sans",system-ui,sans-serif',k.ink);
plot(g,560,170,590,270,k,20,v,v/Math.exp(1.28*MD(p).sig),v*Math.exp(1.28*MD(p).sig));

$("val").innerHTML=`<h2>How reliable is this?</h2><p class="note" style="margin-top:0">Outfield players and goalkeepers have separate models. Each learns from Premier League player-seasons from 2015/16 to 2025/26 (players with 450+ league minutes): 3,989 outfield and 315 goalkeeper. Every test season is scored using only earlier seasons for training. Error is the average gap between forecast and actual value change (smaller is better).</p><h2 style="font-size:17px">Outfield players (tested on players in the league now)</h2><div style="overflow-x:auto"><table><tr><th>Test season</th><th>Players</th><th>Error: no change</th><th>Error: age only</th><th>Error: this model</th><th>Rise/fall called right</th><th>Coin-flip baseline</th></tr><tr><td>2021/22</td><td>84</td><td>31%</td><td>37%</td><td>26%</td><td>71%</td><td>54%</td></tr><tr><td>2022/23</td><td>122</td><td>49%</td><td>38%</td><td>30%</td><td>81%</td><td>67%</td></tr><tr><td>2023/24</td><td>149</td><td>37%</td><td>35%</td><td>27%</td><td>79%</td><td>58%</td></tr><tr><td>2024/25</td><td>185</td><td>37%</td><td>36%</td><td>21%</td><td>86%</td><td>50%</td></tr><tr><td>2025/26</td><td>249</td><td>40%</td><td>35%</td><td>26%</td><td>83%</td><td>51%</td></tr></table></div><h2 style="font-size:17px">Goalkeepers (tested on all goalkeepers)</h2><div style="overflow-x:auto"><table><tr><th>Test season</th><th>Players</th><th>Error: no change</th><th>Error: age only</th><th>Error: this model</th><th>Rise/fall called right</th><th>Coin-flip baseline</th></tr><tr><td>2021/22</td><td>26</td><td>28%</td><td>26%</td><td>21%</td><td>65%</td><td>77%</td></tr><tr><td>2022/23</td><td>28</td><td>43%</td><td>39%</td><td>26%</td><td>75%</td><td>64%</td></tr><tr><td>2023/24</td><td>32</td><td>30%</td><td>34%</td><td>31%</td><td>88%</td><td>62%</td></tr><tr><td>2024/25</td><td>30</td><td>34%</td><td>32%</td><td>24%</td><td>77%</td><td>80%</td></tr><tr><td>2025/26</td><td>28</td><td>48%</td><td>42%</td><td>23%</td><td>79%</td><td>71%</td></tr></table></div>
<p class="note"><b>Limits.</b> The goalkeeper model has far fewer examples (110 goalkeepers), and it beats the benchmarks on error but is not clearly better at calling rise or fall, so treat keeper forecasts with extra caution. Goalkeeper history uses goals conceded and clean sheets taken from match results; saves and save % are shown for this season only because earlier seasons are not in the data. Training only on players who stayed in the league made cheap players look like certain risers, so the models learn from everyone who played. Very cheap players can still show large percentage jumps because their starting values are tiny. The forecast treats the sliders as the season that actually happens, so it is a scenario tool, not a prediction of those stats. Injuries, player xG and trophy odds were not in the data: team points per game stands in for trophy chances and league minutes for availability. Values are Transfermarkt estimates as of June 2026.</p>`;list();shell();
